[package]
name = "elastos-bundle-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Names a capsule bundle by the CID of its files, or refuses; admits and launches nothing"

[dependencies]
elastos-common = { path = "../elastos-common" }
rustix = { version = "=1.1.4", features = ["fs"] }
sha2 = "0.10"

[features]
# The lab's own refusals (its test signatures, records and platform variants).
# Only `lab/capsule-identity` turns this on. A production crate that depends on
# this one asserts at compile time that it is off.
lab = []
