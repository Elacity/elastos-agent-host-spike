[package]
name = "elastos-compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute abstraction layer for ElastOS"

[dependencies]
elastos-common = { path = "../elastos-common" }
elastos-guest = { path = "../elastos-guest" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1.0", features = ["sync", "rt-multi-thread", "time", "fs", "io-util"] }
# RA2 compiles async support for the separate Bus v2 engine. The v1 engine stays
# synchronous. `gc`, `threads`, `stack-switching`, `parallel-compilation` and
# `cache` remain outside this feature set.
wasmtime = { version = "=48.0.9", default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "async",
    "component-model-async",
    "std",
] }
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.0"
# Test fixtures only: turns component text into bytes. The same wasm-tools line as the engine.
wat = "=1.254.2"
