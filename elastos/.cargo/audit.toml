# Reviewed cargo-audit exceptions. The CI job `cargo-audit` runs from elastos/ and reads this file
# for every tracked Cargo.lock. Each entry says why it does not apply or which part is an accepted
# risk, and what removes it.
[advisories]
ignore = [
  # Reviewed 2026-10-20. webpki-roots 0.26.11 (via ureq 2.12.1 in elastos and the
  # availability, content-block-graph, exit and ipfs provider capsules) has no 0.26.x patch:
  # it is a shim whose only item is `pub use parent::TLS_SERVER_ROOTS` from webpki-roots 1,
  # which every lock now pins to the patched 1.0.10 (emSign ECC Root CA - G3 removed), and
  # path checks run in rustls-webpki 0.103.16, which rejects the distrusted intermediates.
  # Remove when ureq 2 leaves these locks (ureq 3 depends on webpki-roots 1 directly).
  # The advisory does not reach this tree: ureq at elastos/capsules/shell/src/main.rs:280 loads webpki-roots 0.26.11, a re-export of the patched webpki-roots 1.0.10 named at elastos/Cargo.lock:6700.
  # re-review by 2026-12-09 at the latest.
  "RUSTSEC-2026-0381",
  # Reviewed 2026-10-23 and 2026-11-25. crypto-bigint 0.5.5 still reaches signing code
  # through elliptic-curve 0.13. k256 0.13.4 and p256 0.13.2 depend on elliptic-curve 0.13.8,
  # and hpke 0.13.0 depends on that p256, in these locks.
  # The 0.5 line has no fix. Accepted: a timing side channel. The 23 Oct review already
  # accepted that the zero-counting, division and Montgomery-multiplication counterparts in
  # 0.5.5 are not proven constant-time, and already said that the subtraction branch, UintRef,
  # BoxedMontyForm and ctutils items are not in 0.5.5. A 0.7 copy in these locks is 0.7.6, or
  # 0.7.11 in the example host-test locks. That review named 0.7.6 as the fix. k256 0.14.0,
  # p256 0.14.0 (July 2026) and hpke 0.15 are stable. Remove this entry when the upgrade of
  # k256, p256 and hpke replaces 0.13 in these locks. That upgrade is a change of its own.
  # re-review by 2026-12-09 at the latest.
  "RUSTSEC-2026-0387",
]
