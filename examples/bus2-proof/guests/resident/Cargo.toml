[package]
name = "bus2-resident-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A resident guest for the lifecycle proof: it redraws on each event and
# stops when its events stream closes.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.60.0", default-features = false, features = ["macros", "async", "realloc"] }
