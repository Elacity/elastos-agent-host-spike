[package]
name = "bus2-photo-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The resident guest, built against the DRAFT elastos:bus@2.0.0 world.

[lib]
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
wit-bindgen = { version = "=0.60.0", default-features = false, features = ["macros", "async", "realloc"] }

[build-dependencies]
bs58 = "0.5"
serde_json = "1"
