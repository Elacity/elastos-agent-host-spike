[package]
name = "bus2-start-loop-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A guest whose start-up code never ends, for the start-up fairness and stop
# proofs.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.60.0", default-features = false, features = ["macros", "async", "realloc"] }
