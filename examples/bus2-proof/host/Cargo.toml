[package]
name = "bus2-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A stub host for the proof, run only by its tests. Not the Runtime.

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
wasmtime = { version = "=48.0.7", default-features = false, features = ["anyhow", "async", "component-model", "component-model-async", "cranelift", "runtime", "wat"] }
wasmparser = { version = "=0.254.2", default-features = false, features = ["std", "component-model"] }
wit-component = "=0.254.2"

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
wat = "=1.254.2"
