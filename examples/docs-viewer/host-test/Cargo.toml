[package]
name = "docs-viewer-host-test"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Host tests only: run the built docs-viewer component inside the Runtime's
# own ComponentProvider (Wasmtime, fuel and memory limits) with a fake bridge.

[dev-dependencies]
elastos-common = { path = "../../../elastos/crates/elastos-common" }
elastos-compute = { path = "../../../elastos/crates/elastos-compute" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wasmtime = "36"
# Same pin as elastos-server, for the copied admission validator.
wasmparser = "=0.236.1"

# Keep this harness outside the main ElastOS Cargo workspace.
[workspace]
