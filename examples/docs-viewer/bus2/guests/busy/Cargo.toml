[package]
name = "docs-bus2-busy-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A guest that never yields, for the fairness test. Copied from
# examples/bus2-proof/guests/busy.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.60.0", default-features = false, features = ["macros", "async", "realloc"] }
