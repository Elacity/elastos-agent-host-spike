[package]
name = "docs-bus2-host-test"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Tests only: the documents guest in the Bus v2 proof's stub host. Not the Runtime.

[dev-dependencies]
bus2-host = { path = "../../../bus2-proof/host" }
# For the proof's own test helpers (bus2-proof/host/tests/common), used as they
# are: they also hold its credential helpers.
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
sha2 = "0.10"
wat = "=1.254.2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
wasmtime = { version = "=48.0.7", default-features = false, features = ["anyhow", "async", "component-model", "component-model-async", "cranelift", "runtime"] }
