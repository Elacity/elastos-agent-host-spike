[package]
name = "docs-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
docs-model = { path = "model" }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = "1.0.151"
wit-bindgen = "0.57.1"

[profile.release]
opt-level = 3
lto = true

# Keep this manual example outside the main ElastOS Cargo workspace.
[workspace]
members = ["model"]
exclude = ["host-test", "bundle-test", "bus2"]
