[package]
name = "photo-viewer-host-test"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Host tests only: run the built photo-viewer component inside the Runtime's
# own ComponentProvider (Wasmtime, fuel and memory limits) with a fake bridge.

[dev-dependencies]
# The shared harness: bridge, ComponentProvider run, admission check, fuel runner.
capsule-v1-host-test = { path = "../../capsule-kit/v1-host-test" }
# This stand-in is not the Runtime start by CID (Runtime::start_by_bundle in elastos/crates/elastos-server/src/runtime.rs; POST /api/launch/open in elastos/crates/elastos-server/src/api/routes.rs).
capsule-bundle = { path = "../bundle" }
elastos-common = { path = "../../../elastos/crates/elastos-common" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Keep this harness outside the main ElastOS Cargo workspace.
[workspace]
