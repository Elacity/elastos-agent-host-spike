[package]
name = "photo-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = "1.0.151"
sha2 = { version = "0.10.9", default-features = false }
wit-bindgen = "0.57.1"

[profile.release]
opt-level = 3
lto = true

# Keep this manual example outside the main ElastOS Cargo workspace.
[workspace]
exclude = ["host-test"]
