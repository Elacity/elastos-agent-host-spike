[package]
name = "archive-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The capsule kit's guest crate: the Bus calls, refusals, reads, URI check and
# the Bus v1 WIT glue.
capsule-kit-guest = { path = "../capsule-kit/guest", features = ["wit"] }
# The typed blocks of a preview: the documents model's, so the page draws one
# shape (DESIGN.md, "What the kit gives", M2).
docs-model = { path = "../docs-viewer/model" }
# The decompressor (DESIGN.md, "Crates"): streaming inflate into the caller's
# fixed window, so every output byte is counted and the caps are in the loop.
miniz_oxide = "0.9.1"
serde_json = "1.0.151"

[dev-dependencies]
capsule-kit-guest = { path = "../capsule-kit/guest", features = ["fake"] }

[profile.release]
opt-level = 3
lto = true

# Keep this manual example outside the main ElastOS Cargo workspace.
[workspace]
