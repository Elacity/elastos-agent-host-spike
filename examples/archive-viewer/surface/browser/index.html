<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="stylesheet" href="./reader.css">
<script type="module" src="./main.js"></script>
</head>
<body>
<main>
  <header>
    <h1 id="archive"></h1>
  </header>
  <section aria-labelledby="entries-title">
    <h2 id="entries-title">Entries</h2>
    <ul id="entries"></ul>
  </section>
  <section aria-labelledby="previews-title">
    <h2 id="previews-title">Previews</h2>
    <div id="previews"></div>
  </section>
  <p id="status" role="status"></p>
  <section aria-labelledby="skipped-title">
    <h2 id="skipped-title" hidden>Not shown</h2>
    <ul id="skipped"></ul>
  </section>
</main>
</body>
</html>
