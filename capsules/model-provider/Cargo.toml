[package]
name = "model-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS model provider - typed local model service"
license = "MIT"

# main.rs only calls run_main; the unit tests live in the library.
[[bin]]
name = "model-provider"
path = "src/main.rs"
test = false

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
anyhow = "1.0"
elastos-model-contract = { path = "../../elastos/crates/elastos-model-contract" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2.5"

[dev-dependencies]
# Paused Tokio clock for tests that hold a deadline until a fixture engine has started.
tokio = { version = "1.0", features = ["test-util"] }
# The shared stand-in's own tests compile into this binary, so its fixture
# signing needs the same crates as `lab/agent-conformance`'s dev-dependencies.
capsule-identity = { path = "../../lab/capsule-identity" }
ed25519-dalek = "2.1"
elastos-identity = { path = "../../elastos/crates/elastos-identity" }
rand = "0.8"
# The stand-in opens and checks each storage file by handle; this crate's
# `tests/process.rs` includes its source, so it needs the same crate.
rustix = { version = "=1.1.4", features = ["fs"] }
tempfile = "3"
