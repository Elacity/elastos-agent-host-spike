[package]
name = "model-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS model provider - typed local model service"
license = "MIT"

# main.rs only calls run_main; the unit tests live in the library.
[[bin]]
name = "model-provider"
path = "src/main.rs"
test = false

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
anyhow = "1.0"
elastos-model-contract = { path = "../../elastos/crates/elastos-model-contract" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2.5"

[dev-dependencies]
# Paused Tokio clock for tests that hold a deadline until a fixture engine has started.
tokio = { version = "1.0", features = ["test-util"] }
# `tests/process.rs` drives the shared live-grant stand-in through the crate
# that owns it, instead of compiling a second copy of its source.
agent-conformance = { path = "../../lab/agent-conformance" }
tempfile = "3"
