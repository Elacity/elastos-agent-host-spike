name: Rust compile cache
description: Content-addressed Rust compile cache for test jobs
runs:
  using: composite
  steps:
    - name: install checksummed sccache
      id: install
      continue-on-error: true
      shell: bash
      env:
        CACHE_RW_MODE: ${{ env.CI_SAVE_CACHE == 'true' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        set -euo pipefail
        checksum=(sha256sum)
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            archive=sccache-v0.18.0-x86_64-unknown-linux-musl
            digest=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
            ;;
          Linux/ARM64)
            archive=sccache-v0.18.0-aarch64-unknown-linux-musl
            digest=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
            ;;
          macOS/ARM64)
            archive=sccache-v0.18.0-aarch64-apple-darwin
            digest=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e
            checksum=(shasum -a 256)
            ;;
          *) exit 1 ;;
        esac
        directory="$RUNNER_TEMP/rust-compile-cache"
        mkdir -p "$directory"
        curl -fsSL --connect-timeout 30 --max-time 120 --retry 3 \
          "https://github.com/mozilla/sccache/releases/download/v0.18.0/$archive.tar.gz" \
          -o "$directory/$archive.tar.gz"
        echo "$digest  $directory/$archive.tar.gz" | "${checksum[@]}" -c -
        tar -xzf "$directory/$archive.tar.gz" -C "$directory" "$archive/sccache"
        # sccache hashes each compiler invocation; lock edits can reuse other crates.
        compiler_key=$(rustc -vV | "${checksum[@]}" | cut -d ' ' -f 1)
        echo "$directory/$archive" >> "$GITHUB_PATH"
        {
          echo "SCCACHE_GHA_ENABLED=on"
          echo "SCCACHE_GHA_VERSION=$compiler_key"
          echo "SCCACHE_GHA_RW_MODE=$CACHE_RW_MODE"
        } >> "$GITHUB_ENV"
    - name: start Rust compile cache with the Actions runtime
      if: steps.install.outcome == 'success'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          // The runner gives Node actions the cache protocol flag and credential.
          // Keep them in this process and its daemon, out of later build steps.
          if (!process.env.ACTIONS_CACHE_SERVICE_V2 ||
              !process.env.ACTIONS_RESULTS_URL || !process.env.ACTIONS_RUNTIME_TOKEN) {
            core.warning('Rust compile cache disabled: the GHA v2 runtime is unavailable.');
          } else {
            const { spawnSync } = require('node:child_process');
            const server = spawnSync('sccache', ['--start-server'], {
              // Keep this daemon alive across long journey steps. A later client
              // cannot restart it with a runtime credential after idle shutdown.
              env: { ...process.env, SCCACHE_IDLE_TIMEOUT: '0' },
              encoding: 'utf8', timeout: 10000,
              stdio: ['ignore', 'pipe', 'pipe']
            });
            if (!server.error && server.status === 0) {
              core.exportVariable('RUSTC_WRAPPER', 'sccache');
              core.exportVariable('CARGO_INCREMENTAL', '0');
              core.info(`Rust compile cache ready: GHA v2, ${process.env.SCCACHE_GHA_RW_MODE}.`);
            } else {
              // Backend errors can include signed URLs. Keep diagnostics credential-free.
              core.warning('Rust compile cache disabled: sccache server startup failed.');
            }
          }
