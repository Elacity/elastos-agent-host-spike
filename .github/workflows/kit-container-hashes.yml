name: Kit container hashes

# One side branch, for KT2 item A3: build each viewer core with the kit's
# unmodified pinned container recipe at one exact commit, on native x86_64
# runners, and print its sha256. Each core is built twice, on two fresh
# runners, so the log shows whether two machines give the same bytes.
on:
  push:
    branches: [claude/m2-kt2-hash-ci]

permissions:
  contents: read

env:
  # The head of claude/m2-examples-landing (the examples-only landing) after its
  # first review round, late on 10 Nov 2026.
  PINNED: c012a96d134531fd625842a5cc572ac2df692b89

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        capsule: [photo-viewer, docs-viewer, archive-viewer]
        machine: [first, second]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: c012a96d134531fd625842a5cc572ac2df692b89
          persist-credentials: false
      - name: Show the pinned commit and a clean tree
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$PINNED"
          test -z "$(git status --porcelain)"
          uname -m
      - name: Build in the pinned container
        run: examples/capsule-kit/repro/build-in-container.sh "examples/${{ matrix.capsule }}"
      - name: Show the source is unchanged after the build
        run: |
          test "$(git rev-parse HEAD)" = "$PINNED"
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Hash the artifact
        run: |
          sudo chown -R "$(id -u)" "examples/${{ matrix.capsule }}"
          sha256sum "examples/${{ matrix.capsule }}/${{ matrix.capsule }}.component.wasm"
          stat -c '%s bytes' "examples/${{ matrix.capsule }}/${{ matrix.capsule }}.component.wasm"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.capsule }}-component-${{ matrix.machine }}
          path: examples/${{ matrix.capsule }}/${{ matrix.capsule }}.component.wasm
          if-no-files-found: error

  # The three example pages in real Chromium, each framed as Home frames apps
  # and served by the kit's stand-in server. No machine on our side had a
  # browser when the gates were first run, so this is where the smokes run.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: c012a96d134531fd625842a5cc572ac2df692b89
          persist-credentials: false
      - name: Show the pinned commit and a clean tree
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$PINNED"
          test -z "$(git status --porcelain)"
      # The browser is installed under Node 24 and the tests then run under
      # Node 26, exactly as the repository's own CI does it. Under Node 26
      # Playwright's installer downloaded the whole archive and then never
      # returned, twice (the full Chrome build, then the headless shell).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the repository's pinned Playwright and its headless Chromium
        timeout-minutes: 8
        run: |
          npm ci --ignore-scripts --prefix elastos/tools/browser-playwright-engine
          npx --prefix elastos/tools/browser-playwright-engine playwright install chromium --with-deps --only-shell
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Page tests (no browser)
        run: |
          node --test examples/photo-viewer/surface/photos.test.mjs
          node --test examples/docs-viewer/surface/reader.test.mjs
          node --test examples/archive-viewer/surface/reader.test.mjs
      - name: Browser smokes
        run: |
          node examples/photo-viewer/surface/photos-browser-smoke.mjs
          node examples/docs-viewer/surface/reader-browser-smoke.mjs
          node examples/archive-viewer/surface/reader-browser-smoke.mjs
      - name: Show the source is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain -- examples)"
