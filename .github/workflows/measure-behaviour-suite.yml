# NOT FOR MERGE. A measurement, on a side branch only: runs the behaviour suite many times
# on the same runner type as CI's test-behaviour job, to count which checks fail at random.
# Why: on 11 Nov a local load harness was found to measure the test machine, not the checks.
# CI's own runners are the instrument. Triggered by a push to ci-measure/**; main's CI ignores it.
name: measure-behaviour-suite
on:
  push:
    branches: ['ci-measure/**']
permissions:
  contents: read
jobs:
  measure:
    name: suite x3, shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: install explicit Browser test inputs
        timeout-minutes: 15
        run: ./scripts/test-behaviour.sh inputs
      - name: run the suite three times and name what fails
        run: |
          echo "head $(git rev-parse HEAD) shard ${{ matrix.shard }} cores $(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            s=$(date +%s)
            if ./scripts/test-behaviour.sh > run-$i.log 2>&1; then r=pass; else r=FAIL; fi
            echo "run $i: $r in $(( $(date +%s) - s )) s" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ $r = FAIL ]; then
              awk '/failing tests:/{f=1; next} f' run-$i.log | grep -E "✖" | sed -E 's/ \([0-9.]+ms\)//' | sort -u | sed 's/^/  /' | tee -a "$GITHUB_STEP_SUMMARY"
              grep -E "AssertionError|TimeoutError|Timeout [0-9]+ms" run-$i.log | sed -E 's/^[[:space:]]+//' | cut -c1-200 | sort | uniq -c | sort -rn | head -5 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: suite-logs-${{ matrix.shard }}
          path: run-*.log
          if-no-files-found: ignore
