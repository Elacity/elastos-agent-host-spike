# Temporary: measures which syscall x86_64 glibc is refused under the
# confine tests' seccomp allow-list ("Cannot allocate TLS block"). The
# allow-list was measured on aarch64 only. Delete once the row is added.
name: x86-seccomp-measure
on:
  push:
    branches: [claude/x86-seccomp-measure]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
      - name: host
        run: |
          uname -a
          ldd --version | head -1
          sudo apt-get install -y -qq strace >/dev/null
      # CI's loop builds did-provider before wallet-provider, so its crates are
      # already downloaded when the confine tests build it offline.
      - name: fetch the did provider's crates
        run: cd capsules/did-provider && cargo build
      - name: build the confine tests
        working-directory: capsules/wallet-provider
        run: cargo test --test confine --no-run
      - name: run the whole confine suite on x86-64
        working-directory: capsules/wallet-provider
        run: cargo test --test confine --no-fail-fast -- --test-threads=2 2>&1 | grep -E "test result|FAILED" || true
      - name: trace the wallet journey
        working-directory: capsules/wallet-provider
        run: |
          mkdir -p "$RUNNER_TEMP/tr"
          strace -ff -s 160 -o "$RUNNER_TEMP/tr/t" \
            cargo test --test confine linux_wallet_journey_runs_under_the_seccomp_allow_list -- --exact --test-threads=1 || true
          cd "$RUNNER_TEMP/tr"
          for f in $(grep -l 'execve(".*/wallet-provider"' t.* | head -2); do
            echo "=== $f (the provider)"
            tail -45 "$f"
            echo "=== refused in $f"
            grep -E "= -1 E(ACCES|NOSYS)" "$f" || echo none
          done
      - name: loader files on this host
        run: ls -l /lib64/ld-linux-x86-64.so.2 /lib/x86_64-linux-gnu/libc.so.6 /lib/x86_64-linux-gnu/libgcc_s.so.1 /lib/x86_64-linux-gnu/libm.so.6 || true
