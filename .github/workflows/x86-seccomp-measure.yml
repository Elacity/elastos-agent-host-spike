# Temporary: measures which syscall x86_64 glibc is refused under the
# confine tests' seccomp allow-list ("Cannot allocate TLS block"). The
# allow-list was measured on aarch64 only. Delete once the row is added.
name: x86-seccomp-measure
on:
  push:
    branches: [claude/x86-seccomp-measure]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
      - name: host
        run: |
          uname -a
          ldd --version | head -1
          sudo apt-get install -y -qq strace >/dev/null
      # CI's loop builds did-provider before wallet-provider, so its crates are
      # already downloaded when the confine tests build it offline.
      - name: fetch the did provider's crates
        run: cd capsules/did-provider && cargo build
      - name: build the confine tests
        working-directory: capsules/wallet-provider
        run: cargo test --test confine --no-run
      - name: log every call the list lacks (the filter logs instead of refusing)
        working-directory: capsules/wallet-provider
        run: |
          cat /proc/sys/kernel/seccomp/actions_logged
          sudo sysctl -qw kernel.printk_ratelimit=0 kernel.printk_ratelimit_burst=100000
          sudo dmesg -C
          for t in linux_did_journey_runs_under_the_seccomp_allow_list linux_wallet_journey_runs_under_the_seccomp_allow_list linux_did_file_row_is_refused_outside_storage_root linux_wallet_file_row_is_refused_outside_storage_root; do
            cargo test --test confine "$t" -- --exact --test-threads=1 2>&1 | grep -E "test result|panicked" -A1 | cut -c1-300 || true
          done
          echo "=== logged calls by process"
          sudo dmesg | grep -E "type=1326|seccomp" | grep -oE 'comm="[^"]*".*syscall=[0-9]+' | sed -E 's/ exe=.*sig=[0-9]+//; s/ arch=[0-9a-f]+//' | sed -E 's/(comm="[^"]*").*(syscall=[0-9]+)/\1 \2/' | sort | uniq -c | sort -rn
          echo "=== raw sample"
          sudo dmesg | grep -E "type=1326" | head -5
