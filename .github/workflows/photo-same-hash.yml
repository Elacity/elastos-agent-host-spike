name: Photo same hash

# One job on one side branch: build the photo core with the unmodified pinned
# container recipe at one exact commit, on a native x86_64 runner, and print its
# sha256 so it can be compared with a build on another machine.
on:
  push:
    branches: [claude/photo-same-hash]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: d047a069aa3ff6bae70ef95ac182bab6388b43bf
          persist-credentials: false
      - name: Show the pinned commit and a clean tree
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = d047a069aa3ff6bae70ef95ac182bab6388b43bf
          test -z "$(git status --porcelain)"
          uname -m
      - name: Build in the pinned container
        run: examples/photo-viewer/repro/build-in-container.sh examples/photo-viewer
      - name: Hash the artifact
        run: |
          sudo chown -R "$(id -u)" examples/photo-viewer
          sha256sum examples/photo-viewer/photo-viewer.component.wasm
          stat -c '%s bytes' examples/photo-viewer/photo-viewer.component.wasm
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: photo-viewer-component
          path: examples/photo-viewer/photo-viewer.component.wasm
          if-no-files-found: error
