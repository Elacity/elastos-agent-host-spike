# mac-evidence-pack pin config
# Labelled map: row -> branch + SHA.
# The pack verifies a pin SHA exists in the pack-owned clone and prints
# that SHA in summary.txt. A row is FAIL with a named reason (never PASS)
# when its pin is missing, superseded, or NEEDS_REPIN.
#
# status:
#   ok          — live pin; verify the SHA, then run the row
#   NEEDS_REPIN — recorded SHA is unsafe or about to move; FAIL, do not guess
#   superseded  — pin was replaced; FAIL
#   missing     — no SHA; FAIL
#
# [pack] is this pack's own clone, not a row.

[pack]
branch = cursor/mac-evidence-pack-be32
remote = https://github.com/Elacity/elastos-agent-host-spike.git

