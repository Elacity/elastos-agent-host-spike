[package]
name = "agent-conformance"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["probe"]
default-members = [".", "probe"]
resolver = "2"

[dependencies]
capsule-identity = { path = "../capsule-identity" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
wasmparser = "=0.247.0"

[profile.release]
opt-level = "s"
lto = true
