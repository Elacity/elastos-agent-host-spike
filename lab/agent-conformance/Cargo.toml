[package]
name = "agent-conformance"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
agent-host = []

[[test]]
name = "agent_host"
required-features = ["agent-host"]

[workspace]
members = ["probe"]
default-members = [".", "probe"]
resolver = "2"

[dependencies]
capsule-identity = { path = "../capsule-identity" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# Lab only: the stand-in opens and checks each storage file by handle. The
# Runtime core never takes this dependency.
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
ed25519-dalek = "2.1"
# The accepted publisher list holds the canonical Ed25519 `did:key`, which
# `capsule-identity` encodes with this crate's one encoder.
elastos-identity = { path = "../../elastos/crates/elastos-identity" }
rand = "0.8"
tempfile = "3"
wasmparser = "=0.247.0"

[profile.release]
opt-level = "s"
lto = true
