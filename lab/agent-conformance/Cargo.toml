[package]
name = "agent-conformance"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["probe"]
default-members = [".", "probe"]
resolver = "2"

[dev-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.10.9"
wasmparser = "=0.247.0"

[profile.release]
opt-level = "s"
lto = true
