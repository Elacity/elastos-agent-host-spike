[package]
name = "elastos-desktop-host"
version = "0.1.0"
edition = "2021"
publish = false

# This crate is one workspace of its own; the repository root workspace stays
# unchanged. Prototype P1 of ELASTOS-DESKTOP-APP: a menu-bar app around Home.
[workspace]

[dependencies]
base64 = "0.22"
fs4 = "1.1.0"
libc = "0.2"
rfd = "0.17.2"
serde_json = "1"
sha2 = "0.10"
tao = "0.37.2"
tray-icon = "0.26.1"
wry = "0.57.1"

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[features]
# Lab builds only: Web Inspector and window-diag.log for the Home window.
lab-diag = ["wry/devtools"]
