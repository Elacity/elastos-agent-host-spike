[package]
name = "elastos-desktop-host"
version = "0.1.0"
edition = "2021"
publish = false

# This crate is one workspace of its own; the repository root workspace stays
# unchanged. Prototype P1 of ELASTOS-DESKTOP-APP: a menu-bar app around Home.
[workspace]

[dependencies]
base64 = "0.22"
fs4 = "1.1.0"
libc = "0.2"
rfd = "0.17.2"
serde_json = "1"
sha2 = "0.10"
tao = "0.37.2"
tray-icon = "0.26.1"
wry = { version = "0.57.1", features = ["devtools"] }
