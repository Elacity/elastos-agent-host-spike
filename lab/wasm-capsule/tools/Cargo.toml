# wc-003a: `wasm-capsule-tools`, the lab's host-side library. It holds the one
# rule that names a lab bundle (src/lab_name.rs). A member of the lab workspace,
# sharing its Cargo.lock. The root package `capsule` uses it only as a
# dev-dependency for the named tests in ../tests/, so none of it reaches the
# capsule artifact.
[package]
name = "wasm-capsule-tools"
version = "0.1.0"
edition = "2021"
publish = false

# Exact pins at the versions the Runtime already locks (elastos/Cargo.lock),
# resolved offline from the cargo cache. `sha2` hashes the canonical closure
# in-process; `libc` gives the no-follow open its flags.
[dependencies]
libc = "=0.2.189"
sha2 = "=0.10.9"
