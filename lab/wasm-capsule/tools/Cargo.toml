# `wasm-capsule-tools`, the lab's host-side library. It names a lab bundle only
# through cc-capsule-identity's lab CID (one re-export in src/lib.rs) and holds
# this capsule's own `elastos.capsule/v1` manifest bytes. A member of the lab
# workspace, sharing its Cargo.lock. The root package `capsule` uses it only as
# a dev-dependency for the named tests in ../tests/, so none of it reaches the
# capsule artifact.
[package]
name = "wasm-capsule-tools"
version = "0.1.0"
edition = "2021"
publish = false

# The one bundle-identity rule lives in the cc-capsule-identity lane's crate
# (read-only here). It path-depends on the Runtime's `elastos-common` and
# `elastos-identity`, so this workspace's Cargo.lock holds that crate's
# dependencies too (README, "The lockfile coupling").
[dependencies]
capsule-identity = { path = "../../capsule-identity" }
