# Pin the toolchain for the lane, so a copy of this folder built on its own
# (adoption, or the reproducibility test's temp copies) uses the same compiler
# the receipt records. This lane uses 1.91.0; the repo root uses 1.95.0.
[toolchain]
channel = "1.91.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
