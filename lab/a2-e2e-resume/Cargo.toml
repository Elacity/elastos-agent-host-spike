[package]
name = "a2-e2e-resume"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "a2-resume-driver"
path = "src/main.rs"

[dependencies]
anyhow = "1"
elastos-common = { path = "../../elastos/crates/elastos-common" }
elastos-compute = { path = "../../elastos/crates/elastos-compute" }
elastos-runtime = { path = "../../elastos/crates/elastos-runtime" }
elastos-server = { path = "../../elastos/crates/elastos-server", features = ["lab-protection"] }
elastos-storage = { path = "../../elastos/crates/elastos-storage" }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
