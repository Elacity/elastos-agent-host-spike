# Lab capsule identity: one deterministic lab CID over a whole capsule bundle.
# Its own workspace (empty `[workspace]`) and Cargo.lock, kept out of the root
# ElastOS workspace so the Runtime core never grows for lab tooling. It reads
# the Runtime's own `CapsuleManifest` through a path dependency and edits
# nothing under `elastos/`.
[package]
name = "capsule-identity"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab only: names a capsule bundle by a lab CID and checks a test-key signature over that name; never admits or launches it"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
elastos-common = { path = "../../elastos/crates/elastos-common" }
elastos-identity = { path = "../../elastos/crates/elastos-identity" }
hex = "0.4"
# Safe `openat`, `fstat` and folder listing from an open handle: the walk
# reads only handles it has checked, and `std` cannot open relative to one.
rustix = { version = "=1.1.4", features = ["fs"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"
tempfile = "3"

# Stay out of the root ElastOS workspace.
[workspace]
